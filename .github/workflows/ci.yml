name: CI Tests

on:
  push:
    branches: [main, base-game]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.8"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run tests
        run: |
          pytest -v

      - name: Verify main.py can be imported
        run: |
          python -c "import main; print('main.py imports successfully')"

      - name: Verify castle_escape module exists
        run: |
          python -c "from castle_escape import castle_escape; print('castle_escape module imports successfully')"
